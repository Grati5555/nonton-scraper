name: Update Nonton Playlist

on:
  schedule:
    # Skrip akan berjalan otomatis setiap 10 menit sekali
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      run: |
        python nonton.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
        git add nonton_playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update nonton playlist [skip ci]" && git push)
