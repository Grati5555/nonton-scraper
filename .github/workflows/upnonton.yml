name: Update Nonton Playlist

on:
  schedule:
    # Skrip akan berjalan otomatis setiap 10 menit sekali
    - cron: '*/10 * * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan skrip secara manual kapan saja

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori Anda
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Menyiapkan lingkungan Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. Menginstal pustaka yang dibutuhkan dari requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Menjalankan skrip Python untuk membuat/memperbarui file .m3u
    - name: Run Scraper Script
      run: |
        python nonton.py

    # 5. Menyimpan/Commit otomatis hasil file playlist (.m3u) yang baru ke dalam repositori
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
        git add nonton_playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update nonton playlist [skip ci]" && git push)
